apiVersion: batch/v1
kind: Job
metadata:
  name: extract

spec:

  completionMode: Indexed
  completions: 10
  parallelism: 3
  
  
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: extract
        image: interp-extract:cpu
        imagePullPolicy: Never
        env:
        - name: ACTS_DIR
          value: /data
        - name: OUT_NAME
          value: gpt2_16_kind_indexed
        - name: HF_HOME
          value: /data/hf_cache
        volumeMounts:
        - name: acts
          mountPath: /data
      volumes:
      - name: acts
        hostPath:
          path: /data/acts